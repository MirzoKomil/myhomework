plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Imzo: DWT_KEYSTORE bo'lsa — doimiy release kalit; bo'lmasa — CI'dagi vaqtinchalik test kalit (debug).
def ks = System.getenv('DWT_KEYSTORE')

android {
    namespace 'uz.domwork.team'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.domwork.team'
        minSdk 23
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('DWT_VERSION_CODE') ?: '1')
        versionName System.getenv('DWT_VERSION_NAME') ?: '1.0'
        buildConfigField 'String', 'APP_URL', '"https://myhomework.uz/"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('DWT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DWT_KEY_ALIAS')
                keyPassword System.getenv('DWT_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.13.1'
}
