plugins {
    id 'com.android.application'
}

// "Ofis" — jonli ofis (myhomework.uz/ofis) ilovasi: telefon va Android TV uchun bitta APK.
// Imzo: Jamoa bilan bir xil (DWT_KEYSTORE bo'lsa — doimiy kalit; bo'lmasa — CI test kaliti).
def ks = System.getenv('DWT_KEYSTORE')

android {
    namespace 'uz.domwork.ofis'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.domwork.ofis'
        minSdk 23
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('DWT_VERSION_CODE') ?: '1')
        versionName System.getenv('DWT_VERSION_NAME') ?: '1.0'
        buildConfigField 'String', 'APP_URL', '"https://myhomework.uz/ofis"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('DWT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DWT_KEY_ALIAS')
                keyPassword System.getenv('DWT_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
