# O'quvchi ilovasining Android APK fayli (sinov uchun).
#
# `android/apk` tarmog'iga har push qilinganda (yoki qo'lda) ishga tushadi:
# Expo loyihasidan Android loyihasini yaratadi, release APK yig'adi va
# GitHub Releases'ga "apk-<raqam>" nomi bilan chiqaradi. Xato bo'lsa,
# yig'ish jurnali "apk-fail-<raqam>" release'iga yuklanadi.
#
# Eslatma: hozircha APK vaqtinchalik (sinov) kalit bilan imzolanadi.
# Play Market uchun doimiy kalit repo egasining akkauntiga o'tgach
# GitHub Secrets orqali qo'shiladi.
name: Android APK

on:
  push:
    branches: [android/apk]
    paths:
      - 'student-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: student-app
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: student-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --no-audit --no-fund 2>&1 | tee ../build.log

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install 2>&1 | tee -a ../build.log

      - name: Build release APK
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee -a ../../build.log

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SHORT=$(git rev-parse --short HEAD)
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/Domwork-${VERSION}-${{ github.run_number }}-${SHORT}.apk"
          ls -la ../dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Android APK ${{ github.run_number }} (sinov)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Sinov uchun Android APK. Tarmoq: ${{ github.ref_name }}, commit: ${{ github.sha }}.
          files: dist/*.apk

      - name: Publish failure log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-fail-${{ github.run_number }}
          name: Android APK ${{ github.run_number }} — xato jurnali
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: build.log
