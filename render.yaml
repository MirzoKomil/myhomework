services:
  - type: web
    name: myhomework
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: LEADS_WEBHOOK_SECRET
        generateValue: true
      # Eskiz ma'lumotlari Render dashboarddagi Environment bo'limida
      # qo'lda kiritiladi. Ular repository yoki render.yaml ichida saqlanmaydi.
      - key: ESKIZ_EMAIL
        sync: false
      - key: ESKIZ_PASSWORD
        sync: false
      - key: ESKIZ_SENDER_NICKNAME
        value: "4546"
