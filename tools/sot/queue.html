      <sc-if value="{{ qShow }}" hint-placeholder-val="{{ false }}"><section class="sk-q up" aria-label="Navbatdagi qoʻngʻiroq">

        <sc-if value="{{ qHas }}" hint-placeholder-val="{{ true }}">

          <sc-if value="{{ qMany }}" hint-placeholder-val="{{ true }}"><button type="button" class="ic sk-qskip" onClick="{{ qSkipGo }}" aria-label="Keyingi lidga oʻtish" title="Oʻtkazib yuborish — keyingi lid"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l10 7-10 7zM19 5v14"></path></svg></button></sc-if>

        <span class="sk-df" title="Kompyuterda qoʻngʻiroq navbati yoʻq — mobil ilova Bosh sahifasidagi “Keyingi qoʻngʻiroq” (sotuvApp.js callQueue :201, screenHome :217). Navbat hech qachon boʻsh emas: avval muddati oʻtgan va bugungi eslatmalar, keyin “Urinilmoqda” va “Yangi” — eng uzoq vaqt qoʻngʻiroq qilinmagani birinchi.">Dizayn farqi</span>
