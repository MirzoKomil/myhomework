<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>ROP — Lidlar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0057B8;text-decoration:none}a:hover{color:#0B1220}
input::placeholder{color:#6B7280}
.dw-chips::-webkit-scrollbar{display:none}
@keyframes dwRow{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.dw-row{animation:dwRow .35s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){.dw-row{animation:none}}
a,button,label{transition:transform .2s ease}a:active,button:active{transform:scale(.97)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0B1220; background: #F5F7FB; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border-bottom: 1px solid #E6EAF2">
    <div style="display: flex; align-items: center; gap: 8px">
      <h1 style="flex: 1; margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Lidlar <span style="font-size: 15px; color: #4B5563; font-weight: 600">{{ total }}</span></h1>
      <a href="RopDistribute.dc.html" style="height: 44px; padding: 0 12px; border-radius: 14px; background: #FEF3F2; color: #B42318; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px">Taqsimlash<span style="min-width: 22px; height: 22px; border-radius: 999px; background: #D92D20; color: #FFFFFF; font-size: 12px; display: grid; place-items: center">7</span></a>
      <a href="RopLeadAdd.dc.html" aria-haspopup="dialog" aria-label="Lid qoʻshish" style="width: 44px; height: 44px; border-radius: 14px; background: #0065D6; color: #FFFFFF; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; border-radius: 14px; background: #F5F7FB; border: 1px solid #E2E8F0; box-sizing: border-box; color: #4B5563">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Lid qidirish</span>
      <input type="search" placeholder="Ism, telefon yoki ID" style="border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; flex: 1; min-width: 0">
    </label>
    <div role="radiogroup" aria-label="Menejer" class="dw-chips" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none">
      <sc-for list="{{ mans }}" as="m" hint-placeholder-count="5">
        <button type="button" role="radio" aria-checked="{{ m.on }}" onClick="{{ m.pick }}" style="{{ m.style }}"><sc-if value="{{ m.img }}" hint-placeholder-val="{{ true }}"><img src="{{ m.img }}" alt="" style="width: 28px; height: 28px; border-radius: 50%"></sc-if>{{ m.label }}</button>
      </sc-for>
    </div>
    <div role="tablist" aria-label="Bosqichlar" class="dw-chips" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{ c.on }}" onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}<span style="{{ c.countStyle }}">{{ c.count }}</span></button>
      </sc-for>
    </div>
  </header>

  <div style="padding: 10px 20px 4px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #4B5563; font-weight: 600">
    <span>{{ hint }}</span>
    <span style="color: #B42318; font-weight: 700">{{ alert }}</span>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 6px 16px 100px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
      <a href="RopLeadCard.dc.html" class="dw-row" style="{{ r.anim }}; flex: none; background: #FFFFFF; border: 1px solid #E6EAF2; border-radius: 18px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; color: inherit">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <strong style="font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.name }}</strong>
          <span style="font-size: 13px; color: #4B5563; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.meta }}</span>
          <span style="{{ r.badgeStyle }}">{{ r.badge }}</span>
        </span>
        <span style="flex: none; display: flex; flex-direction: column; align-items: center; gap: 3px; width: 64px">
          <img src="{{ r.av }}" alt="" style="width: 34px; height: 34px; border-radius: 50%">
          <span style="font-size: 12px; font-weight: 700; color: #3A4456">{{ r.man }}</span>
        </span>
      </a>
    </sc-for>
    <span style="text-align: center; font-size: 12px; color: #4B5563; padding-top: 4px">Kartani oching → menejerni almashtirish yoki bosqichni tuzatish</span>
  </div>

  <nav aria-label="Pastki menyu" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E6EAF2; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 6px 26px; box-sizing: border-box">
    <a href="RopHome.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4B5563; font-size: 12px; font-weight: 600"><span style="width: 52px; height: 28px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"></path></svg></span>Bosh</a>
    <a href="RopLeads.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #0057B8; font-size: 12px; font-weight: 800"><span style="width: 52px; height: 28px; border-radius: 999px; background: #EAF3FF; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8"></path></svg></span>Lidlar</a>
    <a href="RopTrials.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4B5563; font-size: 12px; font-weight: 600"><span style="width: 52px; height: 28px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"></rect><path d="M3 9.5h18M8 3v3M16 3v3"></path></svg></span>Jadval</a>
    <a href="RopTeam.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4B5563; font-size: 12px; font-weight: 600"><span style="width: 52px; height: 28px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-7M21 20H3"></path></svg></span>Jamoa</a>
    <a href="RopMenu.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4B5563; font-size: 12px; font-weight: 600"><span style="width: 52px; height: 28px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span>Menyu</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { stage: 'try', man: 'all' }; }
  renderVals() {
    const TONE = {
      red: 'color:#B42318;background:#FEF3F2', amber: 'color:#93370D;background:#FEF0C7',
      blue: 'color:#0057B8;background:#EAF3FF', green: 'color:#067647;background:#ECFDF3', gray: 'color:#3A4456;background:#F1F5F9'
    };
    const AV = {
      Zarina: '/_blob/b9aca71346c3fe5b85756b5797dc7cb1', Hamidaxon: '/_blob/1e371186761692420cffee7eacdd8f25',
      Bekzod: '/_blob/23cdf5040205eab3e04eb749efde5db4', Gulnora: '/_blob/60cc5ea62670d39355a4ed1c2240bc78',
      Sardor: '/_blob/591ff7093317a38b4deae224e025df54', Nodira: '/_blob/afdd3e8f963453ddcc22787871d42350'
    };
    const MANS = [['all', 'Hammasi', ''], ['Zarina', 'Zarina', AV.Zarina], ['Hamidaxon', 'Hamidaxon', AV.Hamidaxon], ['Bekzod', 'Bekzod', AV.Bekzod], ['Gulnora', 'Gulnora', AV.Gulnora], ['Sardor', 'Sardor', AV.Sardor], ['Nodira', 'Nodira', AV.Nodira]];
    const STAGES = [
      { id: 'new', label: 'Yangi', count: 9, hint: 'Biriktirilgan, hali qoʻngʻiroq yoʻq', alert: '1 tasida 30 daq oʻtdi' },
      { id: 'try', label: 'Urinilmoqda', count: 34, hint: 'Eng uzoq turganlar birinchi', alert: '7 tasi qotgan' },
      { id: 'con', label: 'Bogʻlanildi', count: 21, hint: 'Anketa toʻldirilgan', alert: '1 tasi 6 soatdan oshdi' },
      { id: 'trial', label: 'Sinovda', count: 12, hint: 'Sinov vaqti boʻyicha', alert: '1 tasida natija yoʻq' },
      { id: 'dec', label: 'Qaror', count: 15, hint: 'Kelishilgan qoʻngʻiroq boʻyicha', alert: '' },
      { id: 'pay', label: 'Toʻlovda', count: 6, hint: 'Kutilayotgan summa · 4,8 mln', alert: '' },
      { id: 'won', label: 'Yopildi', count: 81, hint: 'Shu oy · 64,8 mln', alert: '' },
      { id: 'lost', label: 'Muvaffaqiyatsiz', count: 47, hint: 'Sabab bilan · shu oy', alert: '' },
      { id: 'junk', label: 'Sifatsiz', count: 29, hint: 'Shu oy', alert: '' }
    ];
    const ROWS = {
      new: [['Kamola Yusupova', 'Organik · domwork.uz', '38 daq · qoʻngʻiroq yoʻq', 'red', 'Nodira'], ['Ozod Karimov', 'Target · Instagram', '12 daq', 'gray', 'Bekzod'], ['Malika Nurova', 'Target · Facebook', '6 daq', 'gray', 'Hamidaxon']],
      try: [['Shahnoza Aliyeva', '4 urinish · hech javob bermagan', '5-kun · qulf', 'red', 'Nodira'], ['Rustam Toshev', '3 urinish · hech javob bermagan', '4-kun · ertaga qulf', 'amber', 'Nodira'], ['Sanjar Sobirov', '3 urinish · javob bermadi', '3-kun · ogohlantirildi', 'amber', 'Sardor'], ['Dilshod Rahimov', 'Gaplashdi · kechqurun qayta', 'Bugun 18:00', 'blue', 'Hamidaxon'], ['Gulnoza Tursunova', 'Band dedi · 2-urinish', 'Bugun 20:30', 'blue', 'Gulnora'], ['Botir Ergashev', '1-urinish', 'Ertaga 10:00', 'gray', 'Zarina']],
      con: [['Kamol Nazarov', 'Anketa ✓ · sinov qoʻyildi', 'Bugun 15:00 · ustozsiz', 'red', 'Bekzod'], ['Jasur Qodirov', 'Anketa ✓ · 0 daraja', '7 soat · sinov taklif qilinmagan', 'amber', 'Gulnora'], ['Nargiza Alimova', 'Anketa ✓ · A2', 'Narxni soʻradi', 'blue', 'Zarina']],
      trial: [['Sevara Usmonova', 'Kecha · Gulhayo · keldi', 'Natija kiritilmagan · 1 kun', 'red', 'Sardor'], ['Aziz Aliyev', 'Ustoz Ezoza · 30 daq', 'Bugun 18:30', 'green', 'Zarina'], ['Rustam Komilov', 'Ustoz Mohinur hali tasdiqlamagan', 'Bugun 16:00', 'amber', 'Bekzod'], ['Mohira Saidova', 'Ustoz Odina · 30 daq', 'Bugun 19:00', 'green', 'Zarina']],
      dec: [['Nilufar Hamidova', 'Oila bilan maslahatlashadi', 'Bugun 19:00', 'amber', 'Hamidaxon'], ['Ruxsora Qosimova', 'Narxni oʻylayapti', '2 kun · SLA 48 soat', 'red', 'Gulnora']],
      pay: [['Otabek Murodov', 'Click havola yuborildi', '800 000 kutilmoqda', 'amber', 'Zarina'], ['Zilola Xolova', 'Naqd · ertaga ofisga', '800 000 kutilmoqda', 'blue', 'Bekzod']],
      won: [['Madina Ergasheva', 'Rus tili · Gulhayo', '800 000 · bugun', 'green', 'Zarina'], ['Ilhom Yusupov', 'Rus tili · Ezoza', '800 000 · kecha', 'green', 'Hamidaxon']],
      lost: [['Shoira Mahmudova', 'Sabab: boshqa markaz', '17-noy', 'gray', 'Gulnora'], ['Ravshan Toʻrayev', 'Sabab: narx', '15-noy', 'gray', 'Sardor']],
      junk: [['Nomaʼlum raqam', 'Sabab: notoʻgʻri raqam', '18-noy', 'gray', 'Nodira'], ['Farrux A.', 'Sabab: ingliz tili kerak', '14-noy', 'gray', 'Bekzod']]
    };
    const st = this.state.stage, mn = this.state.man;
    const meta = STAGES.find(s => s.id === st) || STAGES[0];
    const chips = STAGES.map(s => {
      const on = s.id === st;
      return {
        label: s.label, count: s.count, on: on ? 'true' : 'false', pick: () => this.setState({ stage: s.id }),
        style: 'flex:0 0 auto;height:44px;padding:0 6px 0 14px;border-radius:999px;font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;' + (on ? 'border:0;background:#0065D6;color:#FFFFFF;font-weight:800' : 'border:1px solid #CBD5E1;background:#FFFFFF;color:#3A4456;font-weight:600'),
        countStyle: 'min-width:26px;height:26px;padding:0 6px;box-sizing:border-box;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:800;' + (on ? 'background:rgba(255,255,255,.22);color:#FFFFFF' : 'background:#F1F5F9;color:#3A4456')
      };
    });
    const mans = MANS.map(m => {
      const on = m[0] === mn;
      return {
        label: m[1], img: m[2], on: on ? 'true' : 'false', pick: () => this.setState({ man: m[0] }),
        style: 'flex:0 0 auto;height:44px;padding:0 12px 0 ' + (m[2] ? '6px' : '12px') + ';border-radius:999px;font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;' + (on ? 'border:2px solid #0B1220;background:#0B1220;color:#FFFFFF;font-weight:800' : 'border:1px solid #E2E8F0;background:#F5F7FB;color:#3A4456;font-weight:600')
      };
    });
    const list = (ROWS[st] || []).filter(r => mn === 'all' || r[4] === mn);
    const rows = list.map((r, i) => ({
      name: r[0], meta: r[1], badge: r[2], man: r[4], av: AV[r[4]],
      anim: 'animation-delay:' + (i * 0.05) + 's',
      badgeStyle: 'align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;' + TONE[r[3]]
    }));
    return { chips, mans, rows, hint: list.length ? meta.hint : 'Bu menejerda shu bosqichda lid yoʻq', alert: meta.alert, total: 254 };
  }
}
</script>
</body>
</html>
